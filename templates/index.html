<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Clone</title>
    <style>
        /* ========== ВСЕ СТИЛИ БЕЗ ИЗМЕНЕНИЙ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg: #0e1621;
            --sidebar: #17212b;
            --chat: #0f1b26;
            --header: #1e2b36;
            --sent: #2b5278;
            --received: #182533;
            --text: #ffffff;
            --text-secondary: #6c7883;
            --accent: #2b5278;
            --online: #4fae4f;
            --border: #0f1b26;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            height: 100%;
            background: var(--sidebar);
            display: flex;
            position: relative;
        }

        @media (min-width: 1024px) {
            .sidebar {
                width: 320px;
                background: var(--sidebar);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
            }
            .chat {
                flex: 1;
                display: flex;
                flex-direction: column;
                background: var(--chat);
            }
            .mobile-menu, .mobile-back {
                display: none !important;
            }
            .message {
                max-width: 65%;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .sidebar {
                width: 280px;
                background: var(--sidebar);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
            }
            .chat {
                flex: 1;
                display: flex;
                flex-direction: column;
                background: var(--chat);
            }
            .mobile-menu, .mobile-back {
                display: none !important;
            }
            .message {
                max-width: 70%;
            }
        }

        @media (max-width: 767px) {
            .sidebar {
                position: absolute;
                width: 100%;
                height: 100%;
                left: -100%;
                top: 0;
                background: var(--sidebar);
                z-index: 1000;
                transition: left 0.3s ease;
                display: flex;
                flex-direction: column;
            }
            .sidebar.show {
                left: 0;
            }
            .chat {
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                background: var(--chat);
            }
            .mobile-menu {
                display: flex !important;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: var(--accent);
                color: white;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                margin-right: 10px;
                cursor: pointer;
                flex-shrink: 0;
            }
            .mobile-back {
                display: flex !important;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: var(--header);
                color: white;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                margin-right: 10px;
                cursor: pointer;
                flex-shrink: 0;
            }
            .message {
                max-width: 85%;
            }
            .chat-header {
                padding: 10px 12px;
                padding-top: max(10px, var(--safe-top));
            }
            .input-area {
                padding: 10px 12px;
                padding-bottom: max(10px, var(--safe-bottom));
            }
            .message-input {
                font-size: 16px;
            }
        }

        .sidebar-header {
            padding: 15px;
            padding-top: max(15px, var(--safe-top));
            background: var(--header);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            color: var(--text);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 3px;
        }

        .search-box {
            padding: 10px 15px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background: var(--header);
            border: none;
            border-radius: 20px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
            position: relative;
        }

        .chat-item:hover {
            background: var(--header);
        }

        .chat-item.active {
            background: #2b3945;
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            position: relative;
            flex-shrink: 0;
        }

        .online-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--online);
            border: 2px solid var(--sidebar);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .unread-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--accent);
            color: white;
            font-size: 12px;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            color: var(--text);
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-last {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header {
            padding: 12px 20px;
            padding-top: max(12px, var(--safe-top));
            background: var(--header);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            color: var(--text);
            font-weight: 500;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header-status {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 3px;
            transition: color 0.3s;
        }

        .chat-header-status.online {
            color: var(--online);
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 5px;
            animation: messageAppear 0.2s ease;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: var(--sent);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: var(--received);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 3px;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .message-status {
            font-size: 11px;
            color: var(--online);
        }

        .message-photo {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--received);
        }

        .message-photo img {
            max-width: 100%;
            max-height: 300px;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .message-photo.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .message-photo.fullscreen img {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .message-video {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
        }

        .message-video video {
            width: 100%;
            max-height: 300px;
            display: block;
        }

        .message-video.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .message-video.fullscreen video {
            width: 100%;
            height: 100%;
            max-height: none;
            object-fit: contain;
        }

        .message-round {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .message-round video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .round-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message-round:hover .round-play {
            opacity: 1;
        }

        .message-round.expanded {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(400px, 80vw);
            height: min(400px, 80vw);
            z-index: 2000;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 50%;
        }

        .message-audio {
            background: var(--header);
            border-radius: 25px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 250px;
        }

        .audio-play {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .audio-play:active {
            transform: scale(0.95);
        }

        .audio-wave {
            flex: 1;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .audio-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s linear;
        }

        .audio-time {
            color: var(--text-secondary);
            font-size: 12px;
            flex-shrink: 0;
        }

        .transcription {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            cursor: pointer;
        }

        .message-document {
            background: var(--header);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            min-width: 250px;
            transition: background 0.2s;
        }

        .message-document:active {
            background: #2b3945;
        }

        .document-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }

        .document-info {
            flex: 1;
            min-width: 0;
        }

        .document-name {
            color: var(--text);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-size {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 3px;
        }

        .document-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .document-preview-header {
            padding: 15px;
            padding-top: max(15px, var(--safe-top));
            background: var(--header);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .document-preview-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .document-preview-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: var(--text);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .typing {
            padding: 5px 15px;
            color: var(--text-secondary);
            font-size: 13px;
            font-style: italic;
            animation: typingPulse 1.5s infinite;
        }

        @keyframes typingPulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .input-area {
            padding: 12px 20px;
            padding-bottom: max(12px, var(--safe-bottom));
            background: var(--header);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .attach-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .attach-btn:active {
            transform: scale(0.95);
        }

        .attach-menu {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: var(--sidebar);
            border-radius: 15px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 5px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .attach-menu.show {
            display: flex;
            animation: menuAppear 0.2s ease;
        }

        @keyframes menuAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .attach-item {
            padding: 12px 20px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .attach-item:hover {
            background: var(--header);
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            background: var(--chat);
            border: none;
            border-radius: 25px;
            color: var(--text);
            font-size: 15px;
            outline: none;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            background: var(--header);
            cursor: not-allowed;
            transform: none;
        }

        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }

        .auth-container {
            background: var(--sidebar);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            animation: modalAppear 0.3s ease;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .auth-title {
            color: var(--text);
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .auth-tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-input {
            width: 100%;
            padding: 15px;
            background: var(--chat);
            border: none;
            border-radius: 10px;
            color: var(--text);
            margin-bottom: 15px;
            outline: none;
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-btn:active {
            background: #366d9e;
        }

        .auth-error {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
        }

        .record-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .record-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .record-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .record-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .record-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .record-btn.record {
            background: #ff4444;
            color: white;
        }

        .record-btn.stop {
            background: #666;
            color: white;
            display: none;
        }

        .record-btn.send {
            background: #4fae4f;
            color: white;
            display: none;
        }

        .record-timer {
            position: absolute;
            top: max(20px, var(--safe-top));
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
        }

        .notification {
            position: fixed;
            top: max(20px, var(--safe-top));
            left: 20px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 4000;
            animation: notificationSlide 0.3s ease;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        @keyframes notificationSlide {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--sidebar);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--header);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app" id="app" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="avatar" id="myAvatar" style="background: #ff7b7b;">U</div>
                <div class="user-info">
                    <div class="user-name" id="myName">Загрузка...</div>
                    <div class="user-status" id="myStatus">online</div>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" id="search" placeholder="Поиск..." autocomplete="off">
            </div>
            
            <div class="chats-list" id="chatsList"></div>
        </div>
        
        <div class="chat">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-header-left">
                    <div class="mobile-menu" onclick="toggleSidebar()">☰</div>
                    <div class="mobile-back" onclick="hideChat()" style="display: none;">←</div>
                    <div class="avatar" id="chatAvatar" style="background: #7b9eff;">U</div>
                </div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chatName">Выберите чат</div>
                    <div class="chat-header-status" id="chatStatus"></div>
                </div>
            </div>
            
            <div class="messages" id="messages"></div>
            <div class="typing" id="typing" style="display: none;"></div>
            
            <div class="input-area">
                <div style="position: relative;">
                    <button class="attach-btn" onclick="toggleMenu()">➕</button>
                    <div class="attach-menu" id="attachMenu">
                        <div class="attach-item" onclick="selectFile('photo')">📷 Фото</div>
                        <div class="attach-item" onclick="selectFile('video')">🎥 Видео</div>
                        <div class="attach-item" onclick="startRound()">🔄 Кружок</div>
                        <div class="attach-item" onclick="selectFile('audio')">🎤 Аудио</div>
                        <div class="attach-item" onclick="selectFile('document')">📄 Документ</div>
                    </div>
                </div>
                <input type="text" class="message-input" id="messageInput" placeholder="Сообщение..." disabled autocomplete="off">
                <button class="send-btn" id="sendBtn" disabled>➡️</button>
            </div>
        </div>
    </div>

    <div class="auth-modal" id="authModal">
        <div class="auth-container">
            <div class="auth-title">Telegram Clone</div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Вход</div>
                <div class="auth-tab" onclick="switchTab('register')">Регистрация</div>
            </div>
            
            <div class="auth-form active" id="loginForm">
                <input type="text" class="auth-input" id="loginUsername" placeholder="Логин" autocomplete="off">
                <input type="password" class="auth-input" id="loginPassword" placeholder="Пароль">
                <button class="auth-btn" onclick="login()">Войти</button>
                <div class="auth-error" id="loginError"></div>
            </div>
            
            <div class="auth-form" id="registerForm">
                <input type="text" class="auth-input" id="regUsername" placeholder="Логин" autocomplete="off">
                <input type="password" class="auth-input" id="regPassword" placeholder="Пароль">
                <input type="password" class="auth-input" id="regConfirm" placeholder="Подтверждение">
                <button class="auth-btn" onclick="register()">Зарегистрироваться</button>
                <div class="auth-error" id="regError"></div>
            </div>
        </div>
    </div>

    <div class="record-modal" id="recordModal">
        <div class="record-container">
            <video class="record-video" id="recordVideo" autoplay muted playsinline></video>
            <div class="record-timer" id="recordTimer">00:00</div>
            <div class="record-controls">
                <button class="record-btn record" onclick="startRecording()" id="startRecord">⏺️</button>
                <button class="record-btn stop" onclick="stopRecording()" id="stopRecord">⏹️</button>
                <button class="record-btn send" onclick="sendRound()" id="sendRound">📤</button>
            </div>
        </div>
    </div>

    <div class="document-preview" id="documentPreview">
        <div class="document-preview-header">
            <div class="document-preview-close" onclick="closeDocumentPreview()">✕</div>
            <div class="document-name" id="previewFileName"></div>
        </div>
        <div class="document-preview-content" id="previewContent"></div>
    </div>

    <script>
        // ========== КОНФИГУРАЦИЯ - ИЗМЕНИТЕ IP НА ВАШ ==========
        const CONFIG = {
            SERVER_URL: 'http://192.168.1.100:8000',  // ЗАМЕНИТЕ НА ВАШ IP
            WS_URL: 'ws://192.168.1.100:8000'         // ЗАМЕНИТЕ НА ВАШ IP
        };

        // Состояние
        let token = localStorage.getItem('token');
        let me = null;
        let currentChat = null;
        let ws = null;
        let deviceId = 'dev_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
        let messages = {};
        let typingTimer = null;
        let pingTimer = null;
        
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordStart = null;
        let recordTimer = null;
        let roundBlob = null;
        
        let currentAudio = null;

        if (token) {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            loadMe();
            connect();
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.auth-tab').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                document.getElementById('loginError').textContent = 'Заполните поля';
                return;
            }
            
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    document.getElementById('authModal').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    loadMe();
                    connect();
                } else {
                    document.getElementById('loginError').textContent = data.detail;
                }
            } catch (e) {
                document.getElementById('loginError').textContent = 'Ошибка подключения к серверу';
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            
            if (!username || !password) {
                document.getElementById('regError').textContent = 'Заполните поля';
                return;
            }
            
            if (password !== confirm) {
                document.getElementById('regError').textContent = 'Пароли не совпадают';
                return;
            }
            
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                if (res.ok) {
                    showNotif('Регистрация успешна! Войдите.');
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    const data = await res.json();
                    document.getElementById('regError').textContent = data.detail;
                }
            } catch (e) {
                document.getElementById('regError').textContent = 'Ошибка подключения к серверу';
            }
        }

        async function loadMe() {
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/user/me`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (res.ok) {
                    me = await res.json();
                    document.getElementById('myName').textContent = me.username;
                    document.getElementById('myAvatar').style.background = me.avatar_color;
                    document.getElementById('myAvatar').textContent = me.username.charAt(0).toUpperCase();
                    loadUsers();
                } else {
                    localStorage.removeItem('token');
                    location.reload();
                }
            } catch (e) {
                showNotif('Ошибка подключения к серверу');
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/users`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (res.ok) {
                    const users = await res.json();
                    renderUsers(users);
                }
            } catch (e) {}
        }

        function renderUsers(users) {
            const list = document.getElementById('chatsList');
            
            if (users.length === 0) {
                list.innerHTML = '<div style="color: #6c7883; padding: 20px; text-align: center;">Нет пользователей</div>';
                return;
            }
            
            list.innerHTML = users.map(u => `
                <div class="chat-item ${currentChat && currentChat.id === u.id ? 'active' : ''}" onclick="selectChat('${u.id}')">
                    <div class="chat-avatar" style="background: ${u.avatar_color}">
                        ${u.username.charAt(0).toUpperCase()}
                        ${u.online ? '<div class="online-indicator"></div>' : ''}
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${u.username}</div>
                        <div class="chat-last" id="last_${u.id}">${getLastMsg(u.id)}</div>
                    </div>
                    ${u.unread > 0 ? `<div class="unread-badge">${u.unread}</div>` : ''}
                </div>
            `).join('');
        }

        function connect() {
            ws = new WebSocket(`${CONFIG.WS_URL}/ws/${token}/${deviceId}`);
            
            ws.onopen = () => {
                console.log('Connected to', CONFIG.WS_URL);
                pingTimer = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({type: 'ping'}));
                    }
                }, 5000);
            };
            
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                handleWS(data);
            };
            
            ws.onclose = () => {
                console.log('WS disconnected');
                if (pingTimer) clearInterval(pingTimer);
                setTimeout(connect, 1000);
            };
        }

        function handleWS(data) {
            if (data.type === 'message') {
                const msg = data.data;
                if (!messages[msg.from_user]) messages[msg.from_user] = [];
                messages[msg.from_user].push(msg);
                
                if (currentChat && msg.from_user === currentChat.id) {
                    addMessage(msg);
                    scrollToBottom();
                    
                    ws.send(JSON.stringify({
                        type: 'read',
                        message_id: msg.id
                    }));
                    
                    updateUnreadCount(msg.from_user, -1);
                } else {
                    updateUnreadCount(msg.from_user, 1);
                }
                
                updateLastMsg(msg.from_user, msg);
            }
            else if (data.type === 'my_message') {
                const msg = data.data;
                if (!messages[msg.to_user]) messages[msg.to_user] = [];
                messages[msg.to_user].push(msg);
                
                if (currentChat && msg.to_user === currentChat.id) {
                    addMessage(msg);
                    scrollToBottom();
                }
                
                updateLastMsg(msg.to_user, msg);
            }
            else if (data.type === 'user_status') {
                updateUserStatus(data.user_id, data.online);
            }
            else if (data.type === 'typing') {
                if (currentChat && data.from_user === currentChat.id) {
                    const el = document.getElementById('typing');
                    if (data.typing) {
                        el.textContent = `${currentChat.username} печатает...`;
                        el.style.display = 'block';
                    } else {
                        el.style.display = 'none';
                    }
                }
            }
            else if (data.type === 'read') {
                updateMessageRead(data.message_id);
            }
        }

        async function selectChat(userId) {
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/messages/${userId}`, {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (res.ok) {
                    const data = await res.json();
                    currentChat = data.user;
                    messages[userId] = data.messages;
                    
                    document.getElementById('chatHeader').style.display = 'flex';
                    document.getElementById('chatAvatar').style.background = currentChat.avatar_color;
                    document.getElementById('chatAvatar').textContent = currentChat.username.charAt(0).toUpperCase();
                    document.getElementById('chatName').textContent = currentChat.username;
                    document.getElementById('chatStatus').textContent = currentChat.online ? 'online' : 'был недавно';
                    document.getElementById('chatStatus').className = 'chat-header-status' + (currentChat.online ? ' online' : '');
                    
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.remove('show');
                        document.querySelector('.mobile-back').style.display = 'flex';
                    }
                    
                    const msgDiv = document.getElementById('messages');
                    msgDiv.innerHTML = '';
                    data.messages.forEach(m => addMessage(m));
                    scrollToBottom();
                    
                    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                    document.querySelector(`[onclick="selectChat('${userId}')"]`).classList.add('active');
                    
                    updateUnreadCount(userId, 0, true);
                }
            } catch (e) {}
        }

        function addMessage(m) {
            const isMe = m.from_user === me.id;
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'sent' : 'received'}`;
            div.id = `msg_${m.id}`;
            
            let content = '';
            
            if (m.type === 'text') {
                content = `<div class="message-bubble">${escapeHtml(m.message)}`;
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div></div>`;
            }
            else if (m.type === 'photo') {
                content = `<div class="message-photo" onclick="openPhotoFullscreen(this)">`;
                content += `<img src="${CONFIG.SERVER_URL}/file/${m.id}" alt="photo" loading="lazy">`;
                content += `</div>`;
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div>`;
            }
            else if (m.type === 'video') {
                content = `<div class="message-video" onclick="openVideoFullscreen(this)">`;
                content += `<video src="${CONFIG.SERVER_URL}/file/${m.id}" preload="metadata" onclick="event.stopPropagation()" controls></video>`;
                content += `</div>`;
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div>`;
            }
            else if (m.type === 'round') {
                content = `<div class="message-round" onclick="expandRound(this)">`;
                content += `<video src="${CONFIG.SERVER_URL}/file/${m.id}" loop muted></video>`;
                content += `<div class="round-play">▶️</div>`;
                content += `</div>`;
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div>`;
            }
            else if (m.type === 'audio') {
                content = `<div class="message-audio">`;
                content += `<button class="audio-play" onclick="playAudio(this, '${CONFIG.SERVER_URL}/file/${m.id}')">▶️</button>`;
                content += `<div class="audio-wave"><div class="audio-progress"></div></div>`;
                content += `<span class="audio-time">${formatDuration(m.duration)}</span>`;
                content += `</div>`;
                if (m.transcription) {
                    content += `<div class="transcription" onclick="showTranscription('${escapeHtml(m.transcription)}')">📝 ${m.transcription.substring(0, 30)}...</div>`;
                }
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div>`;
            }
            else if (m.type === 'document') {
                let icon = '📄';
                if (m.file_name.match(/\.(jpg|jpeg|png|gif|bmp)$/i)) icon = '🖼️';
                else if (m.file_name.match(/\.(mp4|webm|avi|mov)$/i)) icon = '🎥';
                else if (m.file_name.match(/\.(mp3|wav|ogg)$/i)) icon = '🎵';
                else if (m.file_name.match(/\.(pdf)$/i)) icon = '📕';
                else if (m.file_name.match(/\.(doc|docx)$/i)) icon = '📘';
                else if (m.file_name.match(/\.(xls|xlsx)$/i)) icon = '📗';
                else if (m.file_name.match(/\.(ppt|pptx)$/i)) icon = '📙';
                else if (m.file_name.match(/\.(zip|rar|7z)$/i)) icon = '🗜️';
                
                content = `<div class="message-document" onclick="openDocument('${m.id}', '${escapeHtml(m.file_name)}')">`;
                content += `<div class="document-icon">${icon}</div>`;
                content += `<div class="document-info">`;
                content += `<div class="document-name">${escapeHtml(m.file_name)}</div>`;
                content += `<div class="document-size">${formatSize(m.file_size)}</div>`;
                content += `</div>`;
                content += `</div>`;
                content += `<div class="message-time">${formatTime(m.timestamp)}`;
                if (isMe) {
                    content += `<span class="message-status" id="status_${m.id}">${m.is_read ? '✓✓' : '✓'}</span>`;
                }
                content += `</div>`;
            }
            
            div.innerHTML = content;
            document.getElementById('messages').appendChild(div);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text && ws && ws.readyState === WebSocket.OPEN && currentChat) {
                ws.send(JSON.stringify({
                    type: 'message',
                    to: currentChat.id,
                    message: text
                }));
                input.value = '';
                
                if (typingTimer) {
                    clearTimeout(typingTimer);
                    ws.send(JSON.stringify({
                        type: 'typing',
                        to: currentChat.id,
                        typing: false
                    }));
                }
            }
        }

        function handleTyping() {
            if (!ws || !currentChat) return;
            
            if (typingTimer) clearTimeout(typingTimer);
            
            ws.send(JSON.stringify({
                type: 'typing',
                to: currentChat.id,
                typing: true
            }));
            
            typingTimer = setTimeout(() => {
                ws.send(JSON.stringify({
                    type: 'typing',
                    to: currentChat.id,
                    typing: false
                }));
                typingTimer = null;
            }, 2000);
        }

        function toggleMenu() {
            document.getElementById('attachMenu').classList.toggle('show');
        }

        function selectFile(type) {
            document.getElementById('attachMenu').classList.remove('show');
            
            const input = document.createElement('input');
            input.type = 'file';
            
            if (type === 'photo') input.accept = 'image/*';
            else if (type === 'video') input.accept = 'video/*';
            else if (type === 'audio') input.accept = 'audio/*';
            else input.accept = '*/*';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && currentChat) uploadFile(file);
            };
            
            input.click();
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('to_user', currentChat.id);
            
            showNotif('Загрузка...');
            
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/upload`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`},
                    body: formData
                });
                
                if (res.ok) showNotif('Отправлено');
                else showNotif('Ошибка');
            } catch (e) {
                showNotif('Ошибка');
            }
        }

        async function startRound() {
            document.getElementById('attachMenu').classList.remove('show');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: true 
                });
                
                document.getElementById('recordVideo').srcObject = stream;
                document.getElementById('recordModal').style.display = 'flex';
                
                recordedChunks = [];
                roundBlob = null;
                document.getElementById('startRecord').style.display = 'flex';
                document.getElementById('stopRecord').style.display = 'none';
                document.getElementById('sendRound').style.display = 'none';
                document.getElementById('recordTimer').textContent = '00:00';
                
            } catch (e) {
                alert('Нет доступа к камере');
            }
        }

        function startRecording() {
            const stream = document.getElementById('recordVideo').srcObject;
            
            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm'
            });
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                roundBlob = new Blob(recordedChunks, { type: 'video/webm' });
                document.getElementById('sendRound').style.display = 'flex';
            };
            
            mediaRecorder.start();
            recordStart = Date.now();
            recordTimer = setInterval(updateTimer, 1000);
            
            document.getElementById('startRecord').style.display = 'none';
            document.getElementById('stopRecord').style.display = 'flex';
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                clearInterval(recordTimer);
                
                const stream = document.getElementById('recordVideo').srcObject;
                if (stream) stream.getTracks().forEach(t => t.stop());
                
                document.getElementById('stopRecord').style.display = 'none';
            }
        }

        function updateTimer() {
            const sec = Math.floor((Date.now() - recordStart) / 1000);
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            document.getElementById('recordTimer').textContent = `${m}:${s}`;
            
            if (sec >= 60) stopRecording();
        }

        async function sendRound() {
            if (!roundBlob || !currentChat) return;
            
            document.getElementById('recordModal').style.display = 'none';
            
            const file = new File([roundBlob], `round_${Date.now()}.webm`, { type: 'video/webm' });
            
            const formData = new FormData();
            formData.append('file', file);
            formData.append('to_user', currentChat.id);
            
            showNotif('Отправка...');
            
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/upload`, {
                    method: 'POST',
                    headers: {'Authorization': `Bearer ${token}`},
                    body: formData
                });
                
                if (res.ok) showNotif('Отправлено');
                else showNotif('Ошибка');
            } catch (e) {
                showNotif('Ошибка');
            }
        }

        function expandRound(el) {
            el.classList.toggle('expanded');
            const video = el.querySelector('video');
            if (el.classList.contains('expanded')) {
                video.play();
                el.querySelector('.round-play').style.display = 'none';
            } else {
                video.pause();
                el.querySelector('.round-play').style.display = 'flex';
            }
        }

        function openPhotoFullscreen(el) {
            el.classList.toggle('fullscreen');
        }

        function openVideoFullscreen(el) {
            el.classList.toggle('fullscreen');
            const video = el.querySelector('video');
            if (el.classList.contains('fullscreen')) {
                video.play();
            }
        }

        async function openDocument(id, name) {
            try {
                const res = await fetch(`${CONFIG.SERVER_URL}/file/${id}`);
                const text = await res.text();
                
                document.getElementById('previewFileName').textContent = name;
                document.getElementById('previewContent').textContent = text;
                document.getElementById('documentPreview').style.display = 'flex';
            } catch (e) {
                window.open(`${CONFIG.SERVER_URL}/file/${id}`, '_blank');
            }
        }

        function closeDocumentPreview() {
            document.getElementById('documentPreview').style.display = 'none';
        }

        function playAudio(btn, src) {
            if (currentAudio && !currentAudio.paused) {
                currentAudio.pause();
                if (currentAudio.src === src) {
                    currentAudio = null;
                    btn.textContent = '▶️';
                    return;
                }
            }
            
            currentAudio = new Audio(src);
            currentAudio.play();
            btn.textContent = '⏸️';
            
            const wave = btn.parentElement.querySelector('.audio-progress');
            const timeSpan = btn.parentElement.querySelector('.audio-time');
            
            currentAudio.ontimeupdate = () => {
                const p = (currentAudio.currentTime / currentAudio.duration) * 100;
                wave.style.width = p + '%';
                
                const cur = formatDuration(currentAudio.currentTime);
                const tot = formatDuration(currentAudio.duration);
                timeSpan.textContent = `${cur}/${tot}`;
            };
            
            currentAudio.onended = () => {
                btn.textContent = '▶️';
                wave.style.width = '0%';
                currentAudio = null;
            };
        }

        function showTranscription(text) {
            alert(text);
        }

        function updateUserStatus(id, online) {
            if (currentChat && currentChat.id === id) {
                document.getElementById('chatStatus').textContent = online ? 'online' : 'был недавно';
                document.getElementById('chatStatus').className = 'chat-header-status' + (online ? ' online' : '');
            }
            
            const item = document.querySelector(`[onclick="selectChat('${id}')"]`);
            if (item) {
                const avatar = item.querySelector('.chat-avatar');
                const existing = avatar.querySelector('.online-indicator');
                
                if (online && !existing) {
                    const ind = document.createElement('div');
                    ind.className = 'online-indicator';
                    avatar.appendChild(ind);
                } else if (!online && existing) {
                    existing.remove();
                }
            }
        }

        function updateMessageRead(messageId) {
            const status = document.getElementById(`status_${messageId}`);
            if (status) status.textContent = '✓✓';
        }

        function updateUnreadCount(userId, change, reset = false) {
            const item = document.querySelector(`[onclick="selectChat('${userId}')"]`);
            if (!item) return;
            
            let badge = item.querySelector('.unread-badge');
            let count = badge ? parseInt(badge.textContent) : 0;
            
            if (reset) {
                count = 0;
            } else {
                count = Math.max(0, count + change);
            }
            
            if (count > 0) {
                if (badge) {
                    badge.textContent = count;
                } else {
                    badge = document.createElement('div');
                    badge.className = 'unread-badge';
                    badge.textContent = count;
                    item.appendChild(badge);
                }
            } else {
                if (badge) badge.remove();
            }
        }

        function updateLastMsg(id, msg) {
            const el = document.getElementById(`last_${id}`);
            if (el) {
                let text = msg.message;
                if (msg.type !== 'text') {
                    const names = {
                        'photo': '📷 Фото',
                        'video': '🎥 Видео',
                        'round': '🔄 Кружок',
                        'audio': '🎤 Аудио',
                        'document': '📄 Документ'
                    };
                    text = names[msg.type] || '📎 Файл';
                }
                el.textContent = text.length > 30 ? text.substring(0, 30) + '...' : text;
            }
        }

        function getLastMsg(id) {
            if (messages[id] && messages[id].length) {
                const last = messages[id][messages[id].length - 1];
                if (last.type !== 'text') {
                    const names = {
                        'photo': '📷 Фото',
                        'video': '🎥 Видео',
                        'round': '🔄 Кружок',
                        'audio': '🎤 Аудио',
                        'document': '📄 Документ'
                    };
                    return names[last.type] || '📎 Файл';
                }
                return last.message;
            }
            return '';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
        }

        function hideChat() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('show');
                document.querySelector('.mobile-back').style.display = 'none';
                currentChat = null;
            }
        }

        function scrollToBottom() {
            const msgs = document.getElementById('messages');
            msgs.scrollTop = msgs.scrollHeight;
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        }

        function formatDuration(sec) {
            if (!sec) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
            return (bytes/(1024*1024)).toFixed(1) + ' MB';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showNotif(msg) {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 2000);
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('messageInput').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
        document.getElementById('messageInput').oninput = handleTyping;
        
        document.getElementById('search').oninput = (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(i => {
                const name = i.querySelector('.chat-name').textContent.toLowerCase();
                i.style.display = name.includes(q) ? 'flex' : 'none';
            });
        };
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.attach-btn') && !e.target.closest('.attach-menu')) {
                document.getElementById('attachMenu').classList.remove('show');
            }
        });
        
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                document.getElementById('sidebar').classList.remove('show');
            }
        });
        
        document.addEventListener('touchmove', (e) => {
            if (document.getElementById('sidebar').classList.contains('show') && window.innerWidth <= 768) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
